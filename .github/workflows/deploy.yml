name: Deploy to IIS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and publish
        run: dotnet publish -c Release -o ./publish --self-contained false
        shell: powershell

      - name: Deploy to IIS web root
        run: |
          $dest = "${{ vars.IIS_WEBROOT }}"
          if (-not $dest) { throw "IIS_WEBROOT variable is not set." }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          robocopy ./publish $dest /MIR /NP /NFL /NDL
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
        shell: powershell

      - name: Recycle IIS App Pool
        run: |
          $pool = "${{ vars.IIS_APP_POOL }}"
          if ($pool) {
            Import-Module WebAdministration -ErrorAction SilentlyContinue
            Restart-WebAppPool -Name $pool
          }
        shell: powershell
        continue-on-error: true
