name: Deploy to IIS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted   # your Windows IIS machine with the GitHub Actions runner installed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Locate php.exe (not in runner PATH; find it from common locations or IIS config)
      - name: Locate PHP and install Composer dependencies
        run: |
          # 1. Use PHP_PATH variable if set in repo
          $phpExe = "${{ vars.PHP_PATH }}"

          # 2. Search common install locations
          if (-not $phpExe -or -not (Test-Path $phpExe)) {
            $candidates = @(
              'C:\PHP\php.exe',
              'C:\PHP8\php.exe',
              'C:\PHP81\php.exe',
              'C:\PHP82\php.exe',
              'C:\PHP83\php.exe',
              'C:\Program Files\PHP\php.exe',
              'C:\Program Files (x86)\PHP\php.exe'
            )
            $phpExe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          # 3. Fall back to IIS FastCGI registration
          if (-not $phpExe) {
            try {
              Import-Module WebAdministration -ErrorAction Stop
              $cgi = (Get-WebConfiguration 'system.webServer/fastCgi/application').fullPath |
                     Where-Object { $_ -like '*php*' } | Select-Object -First 1
              if ($cgi) { $phpExe = $cgi -replace 'php-cgi\.exe', 'php.exe' }
            } catch {}
          }

          if (-not $phpExe) {
            throw "Cannot locate php.exe. Add a PHP_PATH variable in repo Settings -> Variables (e.g. C:\PHP\php.exe)."
          }

          Write-Host "Using PHP: $phpExe"

          # Download Composer if not in PATH
          if (-not (Get-Command composer -ErrorAction SilentlyContinue)) {
            $setup = "$env:TEMP\composer-setup.php"
            Invoke-WebRequest -Uri 'https://getcomposer.org/installer' -OutFile $setup
            & $phpExe $setup --install-dir="$env:TEMP" --filename=composer.phar
            $composerCmd = "$env:TEMP\composer.phar"
          } else {
            $composerCmd = 'composer'
          }

          & $phpExe $composerCmd install --no-dev --optimize-autoloader --no-interaction
        shell: powershell

      # Copy files to the IIS web root
      # Set IIS_WEBROOT in the repository's Actions secrets/variables, e.g.:
      #   C:\inetpub\wwwroot\flofi
      - name: Deploy files to IIS web root
        run: |
          $dest = "${{ vars.IIS_WEBROOT }}"
          if (-not $dest) { throw "IIS_WEBROOT variable is not set." }

          # Ensure destination exists
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          # Robocopy: mirror everything except .git and .github
          robocopy . $dest /MIR /XD .git .github /XF "*.md" /NP /NFL /NDL
          # Robocopy exit codes 0-7 are success/warning; 8+ are errors
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
        shell: powershell

      # Optional: recycle the IIS app pool so PHP picks up any config changes
      - name: Recycle IIS App Pool
        run: |
          $pool = "${{ vars.IIS_APP_POOL }}"
          if ($pool) {
            Import-Module WebAdministration -ErrorAction SilentlyContinue
            Restart-WebAppPool -Name $pool
            Write-Host "Recycled app pool: $pool"
          } else {
            Write-Host "IIS_APP_POOL not set, skipping recycle."
          }
        shell: powershell
        continue-on-error: true
